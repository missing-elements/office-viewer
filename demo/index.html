<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>office-viewer demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f9;
        --surface: #ffffff;
        --surface-2: #eef1f5;
        --border: #dfe3e8;
        --text: #171a1f;
        --muted: #667085;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-ink: #ffffff;
        --ok: #16a34a;
        --warn: #d97706;
        --danger: #dc2626;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow: 0 1px 2px rgb(16 24 40 / 0.06), 0 12px 32px -20px rgb(16 24 40 / 0.35);
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1116;
          --surface: #151a21;
          --surface-2: #1c222b;
          --border: #2a323d;
          --text: #e7eaee;
          --muted: #98a2b3;
          --accent: #3b82f6;
          --accent-hover: #60a5fa;
          --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px -20px rgb(0 0 0 / 0.8);
        }
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        /* minmax(0, 1fr) keeps no-wrap content from widening the page past the viewport. */
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.45;
        color: var(--text);
        background: var(--bg);
      }

      /* Top bar */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem 1rem;
        padding: 0.85rem 1rem 0.5rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-width: 0;
      }

      .brand > div {
        min-width: 0;
      }

      .brand svg {
        width: 30px;
        height: 30px;
        flex: none;
      }

      .brand h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        max-width: 100%;
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        font-size: 0.8rem;
      }

      .status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }

      .status[data-state='loading'] .dot {
        background: var(--warn);
        animation: pulse 1s infinite;
      }

      .status[data-state='ready'] .dot {
        background: var(--ok);
      }

      .status[data-state='error'] .dot {
        background: var(--danger);
      }

      .status span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* Toolbar */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.75rem 1.25rem;
        margin: 0 1rem 0.75rem;
        padding: 0.75rem 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        min-width: 0;
      }

      .group.grow {
        flex: 1 1 18rem;
      }

      .group.actions {
        flex-direction: row;
        margin-left: auto;
      }

      .label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      button,
      .button,
      select,
      input[type='url'] {
        font: inherit;
        min-height: 2.25rem;
        padding: 0.4rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
      }

      button,
      .button {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      button:hover:not(:disabled),
      .button:hover {
        background: var(--surface-2);
      }

      .primary,
      .primary:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      .primary:hover {
        background: var(--accent-hover);
      }

      .danger {
        color: var(--danger);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      .button:focus-within,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      select,
      input[type='url'] {
        width: 100%;
        min-width: 0;
      }

      select {
        min-width: 9rem;
      }

      .segmented {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        overflow: hidden;
      }

      .segmented button {
        border: 0;
        border-radius: 0;
        background: transparent;
        min-width: 4rem;
        justify-content: center;
      }

      .segmented button + button {
        border-left: 1px solid var(--border);
      }

      .segmented button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--accent-ink);
      }

      /* Workspace */
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.75rem;
        padding: 0 1rem 1rem;
        min-height: 0;
      }

      .stage {
        position: relative;
        height: clamp(340px, 62dvh, 720px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .stage office-viewer {
        position: absolute;
        inset: 0;
      }

      .stage.dragover {
        outline: 2px dashed var(--accent);
        outline-offset: -6px;
      }

      .stage::before {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 3px;
        background: var(--accent);
        z-index: 3;
        opacity: 0;
      }

      .stage[data-state='loading']::before {
        opacity: 1;
        animation: slide 1.1s infinite ease-in-out;
      }

      @keyframes slide {
        to {
          left: 100%;
        }
      }

      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        color: var(--muted);
        pointer-events: none;
        z-index: 1;
      }

      .empty .card {
        display: grid;
        gap: 0.4rem;
        justify-items: center;
        max-width: 26rem;
      }

      .empty svg {
        width: 44px;
        height: 44px;
        opacity: 0.55;
        margin-bottom: 0.25rem;
      }

      .empty strong {
        color: var(--text);
        font-size: 1rem;
      }

      /* Top-right so it never covers the XLSX viewer's own sheet tabs and zoom bar. */
      .stage-tools {
        position: absolute;
        right: 0.75rem;
        top: 0.75rem;
        z-index: 2;
        display: inline-flex;
        gap: 0.15rem;
        padding: 0.2rem;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }

      .stage-tools button {
        min-height: 2rem;
        min-width: 2rem;
        padding: 0 0.65rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        justify-content: center;
      }

      /* Inspector */
      .inspector {
        display: grid;
        gap: 0.75rem;
        align-content: start;
        min-width: 0;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      .panel summary::-webkit-details-marker {
        display: none;
      }

      .panel summary::after {
        content: '';
        width: 0.5rem;
        height: 0.5rem;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 0.15s;
      }

      .panel:not([open]) summary::after {
        transform: rotate(-45deg);
      }

      .panel pre {
        margin: 0;
        padding: 0.75rem 0.9rem;
        font: 0.78rem/1.5 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        border-top: 1px solid var(--border);
        background: var(--surface-2);
      }

      .events {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--border);
        max-height: 16rem;
        overflow: auto;
        font: 0.78rem/1.5 var(--mono);
      }

      .events li {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr);
        gap: 0.6rem;
        padding: 0.35rem 0.9rem;
        border-bottom: 1px solid var(--border);
      }

      .events li:last-child {
        border-bottom: 0;
      }

      .events li.placeholder {
        display: block;
        color: var(--muted);
        padding: 0.6rem 0.9rem;
      }

      .events time {
        color: var(--muted);
      }

      .events .name {
        font-weight: 600;
      }

      .events .name[data-event='ready'] {
        color: var(--ok);
      }

      .events .name[data-event='loadstart'] {
        color: var(--warn);
      }

      .events .name[data-event='loaderror'] {
        color: var(--danger);
      }

      .events .name[data-event='destroy'] {
        color: var(--muted);
      }

      .events .detail {
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Wide screens: the stage fills the viewport and the inspector sits beside it. */
      @media (min-width: 1024px) {
        body {
          height: 100dvh;
          overflow: hidden;
        }

        .workspace {
          grid-template-columns: minmax(0, 1fr) 21rem;
        }

        .stage {
          height: auto;
          min-height: 0;
        }

        .inspector {
          overflow: auto;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true" fill="none">
          <rect x="3" y="3" width="26" height="26" rx="7" fill="var(--accent)" />
          <path d="M10 11h12M10 16h12M10 21h7" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <div>
          <h1>office-viewer</h1>
          <p>Headless &lt;office-viewer&gt; element driving @silurus/ooxml</p>
        </div>
      </div>
      <div id="status" class="status" data-state="idle" role="status" aria-live="polite">
        <span class="dot"></span>
        <span id="status-text">Idle</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Controls">
      <div class="group">
        <span class="label">Load sample</span>
        <div class="segmented" role="group" aria-label="Sample documents">
          <button type="button" data-sample="docx" aria-pressed="false">DOCX</button>
          <button type="button" data-sample="xlsx" aria-pressed="false">XLSX</button>
          <button type="button" data-sample="pptx" aria-pressed="false">PPTX</button>
        </div>
      </div>

      <div class="group">
        <span class="label">Your file</span>
        <label class="button primary">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 11V3m0 0L5 6m3-3 3 3M3 10v2.5A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Open file…
          <input id="file" type="file" accept=".docx,.xlsx,.pptx" hidden />
        </label>
      </div>

      <div class="group">
        <label class="label" for="mode">Mode</label>
        <select id="mode">
          <option value="" selected>default (worker)</option>
          <option value="worker">worker</option>
          <option value="main">main</option>
        </select>
      </div>

      <div class="group grow">
        <label class="label" for="wasm-url">wasmUrl</label>
        <input id="wasm-url" type="url" placeholder="optional absolute .wasm URL for hosted editors" />
      </div>

      <div class="group actions">
        <button id="reload" type="button">Reload</button>
        <button id="destroy" type="button" class="danger">Destroy</button>
      </div>
    </section>

    <main class="workspace">
      <section id="stage" class="stage" data-state="idle" aria-label="Document">
        <div id="empty" class="empty">
          <div class="card">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M14 6h14l10 10v24a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
              <path d="M28 6v10h10M18 26h12M18 32h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <strong>No document loaded</strong>
            <span>Load a sample, open a file, or drop a .docx, .xlsx, or .pptx here.</span>
          </div>
        </div>
        <div class="stage-tools" role="group" aria-label="Zoom">
          <button type="button" data-zoom="out" aria-label="Zoom out" disabled>−</button>
          <button type="button" data-zoom="fit" disabled>Fit</button>
          <button type="button" data-zoom="in" aria-label="Zoom in" disabled>+</button>
        </div>
      </section>

      <aside class="inspector" aria-label="Inspector">
        <details class="panel" open>
          <summary><span class="label">State</span></summary>
          <pre id="summary">{}</pre>
        </details>
        <details class="panel" open>
          <summary><span class="label">Events</span></summary>
          <ol id="events" class="events" aria-live="polite">
            <li class="placeholder">Lifecycle events will appear here.</li>
          </ol>
        </details>
      </aside>
    </main>

    <script type="module">
      import { defineOfficeViewerElement } from '../src'

      const SAMPLES = {
        docx: '/fixtures/sample.docx',
        xlsx: '/fixtures/sample.xlsx',
        pptx: '/fixtures/sample.pptx'
      }

      defineOfficeViewerElement()

      const $ = (selector) => document.querySelector(selector)
      const stage = $('#stage')
      const status = $('#status')
      const statusText = $('#status-text')
      const summary = $('#summary')
      const events = $('#events')
      const empty = $('#empty')
      const modeSelect = $('#mode')
      const wasmUrlInput = $('#wasm-url')
      const fileInput = $('#file')
      const sampleButtons = [...document.querySelectorAll('[data-sample]')]
      const zoomButtons = [...document.querySelectorAll('[data-zoom]')]

      const viewer = document.createElement('office-viewer')
      stage.prepend(viewer)

      let requestedSource = null
      let loadedSource = null

      // The element's events drive the UI. load() promises are awaited only to observe
      // rejections that have no matching event, such as AbortError.
      viewer.addEventListener('loadstart', () => {
        setState('loading', 'Loading…')
        logEvent('loadstart')
      })
      viewer.addEventListener('ready', () => {
        loadedSource = requestedSource
        setState('ready', `${viewer.format.toUpperCase()} ready · ${viewer.mode} mode`)
        logEvent('ready', `${viewer.format}, ${viewer.mode}`)
      })
      viewer.addEventListener('loaderror', (event) => {
        setState('error', event.detail.error.message)
        logEvent('loaderror', event.detail.error.message)
      })
      viewer.addEventListener('destroy', () => {
        loadedSource = null
        setState('idle', 'Destroyed')
        logEvent('destroy')
      })

      for (const button of sampleButtons) {
        button.addEventListener('click', () => {
          fileInput.value = ''
          load(SAMPLES[button.dataset.sample], button.dataset.sample)
        })
      }

      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0]
        if (file) loadFile(file)
      })

      $('#reload').addEventListener('click', () => run(() => viewer.reload()))
      $('#destroy').addEventListener('click', () => viewer.destroy())

      // Zoom goes straight to the upstream viewer returned by getViewer().
      for (const button of zoomButtons) {
        button.addEventListener('click', () => {
          const upstream = viewer.getViewer()
          if (!upstream) return
          const action = button.dataset.zoom
          if (action === 'in') upstream.zoomIn()
          else if (action === 'out') upstream.zoomOut()
          else upstream.fitWidth()
        })
      }

      for (const type of ['dragenter', 'dragover']) {
        stage.addEventListener(type, (event) => {
          event.preventDefault()
          stage.classList.add('dragover')
        })
      }
      for (const type of ['dragleave', 'drop']) {
        stage.addEventListener(type, () => stage.classList.remove('dragover'))
      }
      stage.addEventListener('drop', (event) => {
        event.preventDefault()
        const file = event.dataTransfer?.files?.[0]
        if (file) loadFile(file)
      })

      function loadFile(file) {
        // The element validates the format and reports an unknown one via loaderror.
        load(file, file.name.split('.').pop()?.toLowerCase() ?? '')
      }

      function load(source, format) {
        requestedSource = source
        return run(() =>
          viewer.load(source, {
            format,
            mode: modeSelect.value || undefined,
            wasmUrl: wasmUrlInput.value.trim() || undefined
          })
        )
      }

      async function run(action) {
        try {
          await action()
        } catch (error) {
          // A superseded load rejects with AbortError and needs no message; loaderror has
          // already reported real load failures.
          if (error?.name !== 'AbortError') {
            setState('error', error instanceof Error ? error.message : String(error))
          }
        }
        render()
      }

      function setState(state, text) {
        status.dataset.state = state
        stage.dataset.state = state
        statusText.textContent = text
        render()
      }

      function render() {
        const ready = viewer.ready
        empty.hidden = ready || stage.dataset.state === 'loading'
        for (const button of zoomButtons) button.disabled = !ready
        for (const button of sampleButtons) {
          button.setAttribute('aria-pressed', String(ready && loadedSource === SAMPLES[button.dataset.sample]))
        }
        summary.textContent = JSON.stringify(
          {
            ready,
            format: viewer.format,
            mode: viewer.mode,
            error: viewer.error ? { name: viewer.error.name, message: viewer.error.message } : null
          },
          null,
          2
        )
      }

      function logEvent(name, detail = '') {
        events.querySelector('.placeholder')?.remove()
        const item = document.createElement('li')
        const time = document.createElement('time')
        const now = new Date()
        time.textContent = `${now.toLocaleTimeString([], { hour12: false })}.${String(now.getMilliseconds()).padStart(3, '0')}`
        const label = document.createElement('span')
        label.className = 'name'
        label.dataset.event = name
        label.textContent = name
        const text = document.createElement('span')
        text.className = 'detail'
        text.textContent = detail
        text.title = detail
        item.append(time, label, text)
        events.prepend(item)
        while (events.children.length > 12) events.lastElementChild.remove()
      }

      // Below the desktop breakpoint the inspector sits under the stage; start it collapsed.
      if (matchMedia('(max-width: 1023px)').matches) {
        for (const panel of document.querySelectorAll('details.panel')) panel.open = false
      }

      render()
    </script>
  </body>
</html>
