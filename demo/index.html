<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>office-viewer demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: #f9fafb;
        color: #111827;
      }

      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      select, button, input[type='file'], input[type='url'] {
        font: inherit;
        font-size: 0.875rem;
      }

      input[type='url'] {
        width: 16rem;
        padding: 0.35rem 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        background: #ffffff;
      }

      select {
        padding: 0.35rem 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        background: #ffffff;
      }

      button {
        padding: 0.4rem 0.75rem;
        border: 1px solid #2563eb;
        border-radius: 0.375rem;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button.secondary {
        border-color: #d1d5db;
        background: #ffffff;
        color: #374151;
      }

      button.secondary:hover {
        background: #f3f4f6;
      }

      #status {
        margin-left: auto;
        font-size: 0.875rem;
        color: #6b7280;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 20rem;
        min-height: 0;
      }

      #stage {
        min-height: 0;
        overflow: auto;
      }

      office-viewer {
        width: 100%;
        height: 100%;
      }

      aside {
        padding: 1rem;
        border-left: 1px solid #e5e7eb;
        background: #ffffff;
        overflow: auto;
      }

      aside h2 {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        color: #6b7280;
      }

      pre {
        margin: 0;
        padding: 0.75rem;
        background: #f3f4f6;
        border-radius: 0.375rem;
        font-size: 0.75rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>office-viewer</h1>
      <label>
        Mode
        <select id="mode">
          <option value="" selected>default (worker)</option>
          <option value="worker">worker</option>
          <option value="main">main</option>
        </select>
      </label>
      <label>
        wasmUrl
        <input id="wasm-url" type="url" placeholder="optional absolute .wasm URL" />
      </label>
      <button type="button" data-sample="docx">Load sample DOCX</button>
      <button type="button" data-sample="xlsx">Load sample XLSX</button>
      <button type="button" data-sample="pptx">Load sample PPTX</button>
      <label for="file">
        <input id="file" type="file" accept=".docx,.xlsx,.pptx" />
      </label>
      <button id="reload" type="button" class="secondary">Reload</button>
      <button id="destroy" type="button" class="secondary">Destroy</button>
      <span id="status" role="status">Idle</span>
    </header>
    <main>
      <div id="stage"></div>
      <aside>
        <h2>State</h2>
        <pre id="summary">{}</pre>
      </aside>
    </main>
    <script type="module">
      import { defineOfficeViewerElement } from '../src'

      const SAMPLES = {
        docx: '/fixtures/sample.docx',
        xlsx: '/fixtures/sample.xlsx',
        pptx: '/fixtures/sample.pptx'
      }

      defineOfficeViewerElement()

      const viewer = document.createElement('office-viewer')
      document.querySelector('#stage').append(viewer)

      const modeSelect = document.querySelector('#mode')
      const wasmUrlInput = document.querySelector('#wasm-url')
      const fileInput = document.querySelector('#file')
      const status = document.querySelector('#status')
      const summary = document.querySelector('#summary')

      // The element's events drive the UI. load() promises are awaited only to
      // observe rejections that have no matching event, such as AbortError.
      viewer.addEventListener('loadstart', () => setStatus('Loading...'))
      viewer.addEventListener('ready', () => {
        setStatus(`${viewer.format.toUpperCase()} ready (${viewer.mode})`)
      })
      viewer.addEventListener('loaderror', (event) => {
        setStatus(`Error: ${event.detail.error.message}`)
      })
      viewer.addEventListener('destroy', () => setStatus('Destroyed'))

      for (const button of document.querySelectorAll('[data-sample]')) {
        button.addEventListener('click', () => {
          fileInput.value = ''
          const format = button.dataset.sample
          load(SAMPLES[format], format)
        })
      }

      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0]
        if (!file) return
        // The element validates the format and reports an unknown one via loaderror.
        load(file, file.name.split('.').pop()?.toLowerCase() ?? '')
      })

      document.querySelector('#reload').addEventListener('click', () => run(() => viewer.reload()))
      document.querySelector('#destroy').addEventListener('click', () => viewer.destroy())

      function load(source, format) {
        return run(() =>
          viewer.load(source, {
            format,
            mode: modeSelect.value || undefined,
            wasmUrl: wasmUrlInput.value.trim() || undefined
          })
        )
      }

      async function run(action) {
        try {
          await action()
        } catch (error) {
          // A superseded load rejects with AbortError and needs no message;
          // loaderror has already reported real load failures.
          if (error?.name !== 'AbortError') {
            setStatus(`Error: ${error instanceof Error ? error.message : String(error)}`)
          }
        }
        updateSummary()
      }

      function setStatus(text) {
        status.textContent = text
        updateSummary()
      }

      function updateSummary() {
        summary.textContent = JSON.stringify(
          {
            ready: viewer.ready,
            format: viewer.format,
            mode: viewer.mode,
            error: viewer.error ? { name: viewer.error.name, message: viewer.error.message } : null
          },
          null,
          2
        )
      }

      updateSummary()
    </script>
  </body>
</html>
