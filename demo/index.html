<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOXML integration spike</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 22rem 1fr;
        background: #111827;
        color: #f9fafb;
      }

      aside {
        padding: 1rem;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        background: #0f172a;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      #viewer {
        min-height: 0;
        height: calc(100vh - 15rem);
        margin: 1rem;
        border-radius: 0.75rem;
        overflow: hidden;
        background: #1f2937;
      }

      label, button, input, select {
        font: inherit;
      }

      button {
        padding: 0.55rem 0.8rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #1d4ed8;
        color: white;
        cursor: pointer;
      }

      button.secondary {
        background: #374151;
      }

      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 0.55rem 0.7rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #111827;
        color: inherit;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #020617;
        padding: 0.75rem;
        border-radius: 0.5rem;
        overflow: auto;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .stack {
        display: grid;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>OOXML spike</h1>
      <p>Raw integration harness for <code>@silurus/ooxml</code>. Worker mode is the default path.</p>
      <div class="stack">
        <label>
          Format
          <select id="format">
            <option value="docx">DOCX</option>
            <option value="xlsx">XLSX</option>
            <option value="pptx">PPTX</option>
          </select>
        </label>
        <label>
          Mode
          <select id="mode">
            <option value="worker">worker</option>
            <option value="main">main</option>
          </select>
        </label>
        <label>
          URL source
          <input id="url" type="text" />
        </label>
        <label>
          Local file source
          <input id="file" type="file" />
        </label>
        <label>
          Optional wasmUrl override
          <input id="wasmUrl" type="text" placeholder="leave empty to use upstream default asset resolution" />
        </label>
      </div>
      <div class="row">
        <button id="load-url">Load URL</button>
        <button id="load-file" class="secondary">Load File</button>
      </div>
      <div class="row">
        <button id="sample-url">Sample URL</button>
        <button id="sample-file" class="secondary">Sample File</button>
      </div>
      <div class="row">
        <button id="reload" class="secondary">Reload</button>
        <button id="destroy" class="secondary">Destroy</button>
      </div>
      <pre id="summary" aria-live="polite"></pre>
    </aside>
    <main>
      <div style="padding: 1rem 1rem 0;">
        <strong>Status:</strong>
        <span id="status">Idle</span>
      </div>
      <div id="viewer"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
