<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>office-viewer demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: #f9fafb;
        color: #111827;
      }

      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      select, button, input[type='file'] {
        font: inherit;
        font-size: 0.875rem;
      }

      select {
        padding: 0.35rem 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        background: #ffffff;
      }

      button {
        padding: 0.4rem 0.75rem;
        border: 1px solid #2563eb;
        border-radius: 0.375rem;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button.secondary {
        border-color: #d1d5db;
        background: #ffffff;
        color: #374151;
      }

      button.secondary:hover {
        background: #f3f4f6;
      }

      #status {
        margin-left: auto;
        font-size: 0.875rem;
        color: #6b7280;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 20rem;
        min-height: 0;
      }

      #stage {
        min-height: 0;
        padding: 1rem;
        overflow: auto;
      }

      office-viewer {
        width: 100%;
        height: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        background: #ffffff;
      }

      aside {
        padding: 1rem;
        border-left: 1px solid #e5e7eb;
        background: #ffffff;
        overflow: auto;
      }

      aside h2 {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        color: #6b7280;
      }

      pre {
        margin: 0;
        padding: 0.75rem;
        background: #f3f4f6;
        border-radius: 0.375rem;
        font-size: 0.75rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>office-viewer</h1>
      <label>
        Format
        <select id="format">
          <option value="docx" selected>DOCX</option>
          <option value="xlsx">XLSX</option>
          <option value="pptx">PPTX</option>
        </select>
      </label>
      <label>
        Mode
        <select id="mode">
          <option value="worker" selected>worker</option>
          <option value="main">main</option>
        </select>
      </label>
      <button id="load-sample">Load sample</button>
      <label id="file-label" for="file">
        <input id="file" type="file" accept=".docx,.xlsx,.pptx" />
      </label>
      <button id="reload" class="secondary">Reload</button>
      <button id="destroy" class="secondary">Destroy</button>
      <span id="status">Idle</span>
    </header>
    <main>
      <div id="stage"></div>
      <aside>
        <h2>State</h2>
        <pre id="summary">{}</pre>
      </aside>
    </main>
    <script type="module">
      import { defineOfficeViewerElement } from '../src'

      const SAMPLES = {
        docx: '/fixtures/sample.docx',
        xlsx: '/fixtures/sample.xlsx',
        pptx: '/fixtures/sample.pptx'
      }

      defineOfficeViewerElement()
      
      // Create viewer element and attach to DOM
      const viewer = document.createElement('office-viewer')
      const stage = document.querySelector('#stage')
      stage.append(viewer)

      // State management
      let currentFormat = 'docx'
      let currentMode = 'worker'
      
      let wasmUrl = undefined

      // UI controls
      const formatSelect = document.querySelector('#format')
      const modeSelect = document.querySelector('#mode')
      const fileInput = document.querySelector('#file')
      const status = document.querySelector('#status')
      const summary = document.querySelector('#summary')

      // Event handlers for select changes
      formatSelect.addEventListener('change', () => {
        currentFormat = formatSelect.value
        wasmUrl = undefined
        fileInput.value = ''
        viewer.destroy()
      })

      modeSelect.addEventListener('change', () => {
        currentMode = modeSelect.value === 'main' ? 'main' : 'worker'
      })

      // Load sample file
      document.querySelector('#load-sample').addEventListener('click', async () => {
        await loadSample()
      })

      // Load uploaded file
      document.querySelector('#file').addEventListener('change', async (e) => {
        const target = e.target
        const file = target.files?.[0]
        if (!file) return
        
        status.textContent = `Loading ${file.name}...`
        await loadFile(file)
      })

      // Reload button
      document.querySelector('#reload').addEventListener('click', async () => {
        if (!viewer.retainedSource || !viewer.retainedOptions) {
          status.textContent = 'Nothing loaded yet.'
          return
        }
        try {
          status.textContent = 'Reloading...'
          await viewer.reload()
          status.textContent = `Reloaded (${currentMode})`
        } catch (error) {
          status.textContent = `Reload failed: ${error instanceof Error ? error.message : String(error)}`
        }
      })

      // Destroy button
      document.querySelector('#destroy').addEventListener('click', () => {
        viewer.destroy()
        status.textContent = 'Destroyed'
        currentFormat = null
        currentMode = 'worker'
      })

      async function loadSample() {
        if (!currentFormat) {
          status.textContent = 'No format selected.'
          return
        }
        await loadFile(SAMPLES[currentFormat])
        formatSelect.value = currentFormat
      }

      async function loadFile(source, formatOverride = null) {
        // Support both File objects and URL strings (from SAMPLES)
        let ext
        
        if (typeof source === 'string') {
          const url = new URL('file://' + source)
          ext = url.pathname.split('/').pop()?.split('.').pop()?.toLowerCase() || 'docx'
        } else if (source instanceof Blob) {
          ext = source.name.split('.').pop()?.toLowerCase() || 'docx'
        } else {
          ext = 'docx'
        }
        
        ext = formatOverride ? formatOverride.toLowerCase() : ext
        
        if (!['docx', 'xlsx', 'pptx'].includes(ext)) {
          status.textContent = `Error: Unsupported file format. Expected .docx, .xlsx, or .pptx`
          updateSummary()
          return
        }

        currentFormat = ext
        formatSelect.value = currentFormat
        status.textContent = `Loading ${ext.toUpperCase()}...`
        updateSummary()

        try {
          await viewer.load(source, {
            format: ext,
            mode: currentMode,
            wasmUrl: wasmUrl
          })
          status.textContent = `${ext.toUpperCase()} ready (${currentMode})`
        } catch (error) {
          status.textContent = `Error: ${error instanceof Error ? error.message : String(error)}`
        }

        updateSummary()
      }

      const updateSummary = () => {
        console.log('Updating summary...', { status: viewer.status })
        summary.textContent = JSON.stringify({
          status: viewer.status,
          error: viewer.error ? { name: viewer.error.name, message: viewer.error.message } : null,
          format: viewer.format,
          mode: viewer.mode
        }, null, 2)
      }

      updateSummary()
    </script>
  </body>
</html>
